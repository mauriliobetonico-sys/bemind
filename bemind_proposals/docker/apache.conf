<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # bloqueia acesso via HTTP a app/config/database/storage
    <DirectoryMatch "^/var/www/html/(app|config|database|storage)(/|$)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
