<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<style>
  @page {
    size: A4;
    margin: 2cm 2cm 3cm 2cm;
    @bottom-center {
      content: "Página " counter(page) " de " counter(pages);
      font-size: 9pt;
      color: #666;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 10pt; color: #333; }
  .header { border-bottom: 3px solid #1e40af; padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: flex-start; }
  .company-name { font-size: 18pt; font-weight: bold; color: #1e40af; }
  .company-info { font-size: 9pt; color: #555; line-height: 1.6; }
  .doc-title { font-size: 14pt; font-weight: bold; color: #1e40af; text-align: right; }
  .doc-number { font-size: 11pt; color: #555; text-align: right; }
  table { width: 100%; border-collapse: collapse; margin: 12px 0; }
  th { background: #1e40af; color: white; padding: 7px 8px; text-align: left; font-size: 9pt; }
  td { padding: 6px 8px; border-bottom: 1px solid #e5e7eb; font-size: 9pt; }
  tr:nth-child(even) td { background: #f8fafc; }
  .text-right { text-align: right; }
  .text-center { text-align: center; }
  .section { margin: 16px 0; }
  .section-title { font-weight: bold; color: #1e40af; border-bottom: 1px solid #e5e7eb; padding-bottom: 4px; margin-bottom: 8px; font-size: 10pt; }
  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .info-item { font-size: 9pt; }
  .info-label { font-weight: bold; color: #555; }
  .total-box { background: #1e40af; color: white; padding: 10px 16px; text-align: right; font-size: 12pt; font-weight: bold; border-radius: 4px; margin-top: 12px; }
  .signature-area { margin-top: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
  .signature-line { border-top: 1px solid #333; padding-top: 6px; text-align: center; font-size: 9pt; color: #555; }
  .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 8pt; font-weight: bold; }
  .badge-green { background: #d1fae5; color: #065f46; }
  .badge-blue { background: #dbeafe; color: #1e40af; }
  .badge-yellow { background: #fef3c7; color: #92400e; }
  .badge-red { background: #fee2e2; color: #991b1b; }
  .badge-gray { background: #f3f4f6; color: #374151; }
  .notes { background: #f8fafc; border-left: 3px solid #1e40af; padding: 10px; font-size: 9pt; color: #555; margin: 8px 0; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="company-name">{{ company.name }}</div>
    <div class="company-info">
      CNPJ: {{ company.cnpj }}<br>
      {{ company.address }}<br>
      Tel: {{ company.phone }} | {{ company.email }}
    </div>
  </div>
  <div>
    {% block doc_header %}{% endblock %}
  </div>
</div>

{% block content %}{% endblock %}

</body>
</html>
