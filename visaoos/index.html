<script>
// ═══════════════════════════════════════════════════
// FETCH INTERCEPTOR — Funciona sem mod_rewrite/Nginx
// Converte /api/X/Y/Z → index.php?resource=X&id=Y&sub=Z
// ═══════════════════════════════════════════════════
(function() {
  var _origFetch = window.fetch.bind(window);
  window.fetch = function(input, init) {
    if (typeof input === 'string' && input.indexOf('/api/') === 0) {
      var qIdx   = input.indexOf('?');
      var path   = qIdx >= 0 ? input.slice(0, qIdx) : input;
      var qs     = qIdx >= 0 ? input.slice(qIdx + 1) : '';
      var parts  = path.replace(/^\/api\/?/, '').split('/').filter(Boolean);
      var params = new URLSearchParams(qs);
      if (parts[0]) params.set('resource', parts[0]);
      if (parts[1]) params.set('id',       parts[1]);
      if (parts[2]) params.set('sub',      parts[2]);
      if (parts[3]) params.set('sub2',     parts[3]);
      input = 'index.php?' + params.toString();
    }
    return _origFetch(input, init);
  };
})();

// ═══════════════════════════════════════════════════
// CORE — State, API, Auth, Router
// ═══════════════════════════════════════════════════

// FIX P1+P2: Token tem única fonte de verdade em Auth.
// App não mistura mais autenticação, charts e debounce no mesmo bag.
const Auth = {
  user: null,
  getToken() { return this._token || localStorage.getItem('visaoos_token'); },
  setToken(t) { this._token = t; localStorage.setItem('visaoos_token', t); },
  clearToken() { this._token = null; localStorage.removeItem('visaoos_token'); localStorage.removeItem('visaoos_refresh'); },
  _token: null
};

// FIX P2: Charts e debounce separados do estado de autenticação.
const UI = { charts: {}, debounceTimers: {} };

// FIX P8: Paginação e filtros de OS agrupados em namespace próprio.
// FIX P4: Estado de filtros vive em JS — o DOM só exibe/captura input,
//         não é mais o repositório primário.
const Filters = {
  os:   { search: '', status: '', payment: '', page: 1 },
  quotes:   { search: '', status: '' },
  receipts: { search: '' },
  clients:  { search: '' },
  suppliers:{ search: '' },
  resellers:{ search: '' },
  materials:{ search: '' },
  services: { search: '' },
};

// FIX P5: Cache de dados de referência com TTL de 5 minutos.
// Clientes, usuários, materiais e serviços raramente mudam — não
// precisam ser buscados a cada abertura de modal.
const Cache = {
  _store: {},
  TTL: 5 * 60 * 1000,
  async get(key, fetcher) {
    const entry = this._store[key];
    if (entry && (Date.now() - entry.ts) < this.TTL) return entry.data;
    const data = await fetcher();
    if (data && !data.error) this._store[key] = { data, ts: Date.now() };
    return data || [];
  },
  // Chamado após criar/editar registros para forçar re-fetch na próxima vez.
  invalidate(...keys) { keys.forEach(k => delete this._store[k]); }
};

// Retrocompat: módulos legados que ainda referenciam App.user / App.token
const App = {
  get user() { return Auth.user; },
  set user(v) { Auth.user = v; },
  get token() { return Auth.getToken(); },
  set token(v) { Auth.setToken(v); },
  get charts() { return UI.charts; },
  get debounceTimers() { return UI.debounceTimers; },
};

const NAV_ITEMS = [
  { id:'dashboard',  label:'Dashboard',          icon:'📊', roles:['admin','atendimento','producao','financeiro'] },
  { id:'os',         label:'Ordens de Serviço',  icon:'🗒️', roles:['admin','atendimento','producao','financeiro'] },
  { id:'quotes',     label:'Orçamentos',          icon:'💬', roles:['admin','atendimento'] },
  { id:'receipts',   label:'Recibos',             icon:'🧾', roles:['admin','atendimento','financeiro'] },
  { id:'clients',    label:'Clientes',            icon:'👥', roles:['admin','atendimento'] },
  { id:'suppliers',  label:'Fornecedores',        icon:'🏭', roles:['admin','atendimento'] },
  { id:'resellers',  label:'Revendedores',        icon:'🤝', roles:['admin','atendimento','financeiro'] },
  { id:'materials',  label:'Materiais',           icon:'📦', roles:['admin','atendimento','producao'] },
  { id:'services',   label:'Serviços',            icon:'🔧', roles:['admin','atendimento'] },
  { id:'finance',    label:'Financeiro',          icon:'💰', roles:['admin','financeiro'] },
  { id:'users',      label:'Usuários',            icon:'👤', roles:['admin'] },
];

async function api(method, path, data=null) {
  // FIX P1: Token sempre lido de Auth (fonte única), nunca diretamente do localStorage.
  const tok = Auth.getToken();
  const opts = { method, headers:{ 'Authorization':`Bearer ${tok}` } };
  if (data) { opts.headers['Content-Type']='application/json'; opts.body=JSON.stringify(data); }
  try {
    const res = await fetch('/api'+path, opts);
    if (res.status===401) { handleLogout(); return null; }
    const ct = res.headers.get('content-type')||'';
    if (ct.includes('json')) return res.json();
    return { ok: res.ok, status: res.status };
  } catch(e) { toast('Erro de conexão','error'); return null; }
}

async function login(email, pass) {
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000); // timeout 15s
    const r = await fetch('/api/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password:pass}),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    const ct = r.headers.get('content-type') || '';
    if (!ct.includes('json')) {
      // Servidor retornou HTML/texto — problema de configuração
      const text = await r.text();
      const hint = r.status === 404 ? 'Endpoint não encontrado — verifique o .htaccess e mod_rewrite.'
                 : r.status === 500 ? 'Erro interno no servidor — verifique o .env e o banco de dados.'
                 : `HTTP ${r.status}`;
      return { error: `Falha na comunicação com o servidor: ${hint}` };
    }
    return r.json();
  } catch(e) {
    if (e.name === 'AbortError') return { error: 'Tempo limite excedido. Verifique se o servidor está acessível.' };
    return { error: 'Erro de conexão: ' + e.message };
  }
}

function handleLogout() {
  Auth.clearToken(); // FIX P1: uma única chamada limpa ambos os lugares.
  Auth.user = null;
  Cache.invalidate('clients','users','materials','services'); // limpa cache ao sair
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
}

function buildNav() {
  const role = App.user.role;
  const nav = document.getElementById('sidebar-nav');
  nav.innerHTML = NAV_ITEMS
    .filter(n => n.roles.includes(role))
    .map(n => `<div class="nav-item flex items-center gap-3 px-2.5 py-2.5 rounded-lg text-white/60 hover:text-white hover:bg-white/10 cursor-pointer transition-colors text-sm font-medium" data-page="${n.id}">
      <span class="text-base w-5 text-center">${n.icon}</span>
      <span class="sidebar-text">${n.label}</span>
    </div>`).join('');
  nav.querySelectorAll('.nav-item').forEach(el =>
    el.addEventListener('click', () => navigate(el.dataset.page)));
}

function navigate(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('bg-primary', n.dataset.page===page);
    n.classList.toggle('text-white', n.dataset.page===page);
    n.classList.toggle('text-white/60', n.dataset.page!==page);
  });
  const el = document.getElementById('page-'+page);
  if (el) el.classList.add('active');
  const item = NAV_ITEMS.find(n=>n.id===page);
  document.getElementById('page-title').textContent = item ? item.label : page;
  localStorage.setItem('visaoos_page', page);
  loadPage(page);
  if (window.innerWidth < 768) toggleSidebar(false);
}

function loadPage(page) {
  const fns = {
    dashboard: loadDashboard, os: loadOS, quotes: loadQuotes,
    receipts: loadReceipts, clients: loadClients, suppliers: loadSuppliers,
    resellers: loadResellers, materials: loadMaterials, services: loadServices,
    finance: loadFinance, users: loadUsers
  };
  if (fns[page]) fns[page]();
}

function toggleSidebar(force) {
  const s = document.getElementById('sidebar');
  const ov = document.getElementById('sidebar-overlay');
  const open = force !== undefined ? force : !s.classList.contains('open');
  s.classList.toggle('open', open);
  ov.classList.toggle('hidden', !open);
}

// ─── Toast ────────────────────────────────────────
function toast(msg, type='success') {
  const c = document.getElementById('toast-container');
  const el = document.createElement('div');
  el.className = `toast-item ${type}`;
  el.textContent = (type==='success'?'✓ ':type==='error'?'✕ ':'ℹ ') + msg;
  c.appendChild(el);
  requestAnimationFrame(() => { requestAnimationFrame(() => el.classList.add('show')); });
  setTimeout(() => { el.classList.remove('show'); setTimeout(()=>el.remove(), 400); }, 3200);
}

// ─── Utilities ────────────────────────────────────
const fmt = {
  currency: v => 'R$ ' + Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}),
  date: v => v ? new Date(v+'T00:00:00').toLocaleDateString('pt-BR') : '—',
  datetime: v => v ? new Date(v).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '—',
  area: v => v ? Number(v).toFixed(2)+'m²' : '—'
};

function badge(text, color) {
  const colors = {
    yellow:'bg-yellow-100 text-yellow-800', green:'bg-green-100 text-green-800',
    blue:'bg-blue-100 text-blue-800', red:'bg-red-100 text-red-800',
    gray:'bg-gray-100 text-gray-600', indigo:'bg-indigo-100 text-indigo-700',
    purple:'bg-purple-100 text-purple-700'
  };
  return `<span class="badge ${colors[color]||colors.gray}">${text}</span>`;
}

function osBadge(s) {
  const m={aguardando:['Aguardando','yellow'],producao:['Em Produção','blue'],finalizado:['Finalizado','green'],entregue:['Entregue','gray']};
  const [l,c]=m[s]||[s,'gray']; return badge(l,c);
}
function payBadge(s) {
  const m={pendente:['Pendente','yellow'],parcial:['Parcial','blue'],pago:['Pago','green']};
  const [l,c]=m[s]||[s,'gray']; return badge(l,c);
}
function quoteBadge(s) {
  const m={pendente:['Pendente','yellow'],aprovado:['Aprovado','green'],recusado:['Recusado','red'],convertido:['Convertido','blue']};
  const [l,c]=m[s]||[s,'gray']; return badge(l,c);
}

function debounce(key, fn, ms=320) {
  clearTimeout(UI.debounceTimers[key]);
  UI.debounceTimers[key] = setTimeout(fn, ms);
}

function tableWrap(id, cols, emptyMsg='Nenhum registro encontrado.') {
  return `<div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-100">
          <tr>${cols.map(c=>`<th class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">${c}</th>`).join('')}</tr>
        </thead>
        <tbody id="${id}">
          <tr><td colspan="${cols.length}" class="px-4 py-8 text-center text-gray-400 text-sm">${emptyMsg}</td></tr>
        </tbody>
      </table>
    </div>
  </div>`;
}

function loadingRow(cols) {
  return `<tr><td colspan="${cols}" class="px-4 py-8 text-center text-gray-400 text-sm">
    <span class="inline-block spin">⟳</span> Carregando...
  </td></tr>`;
}

function emptyRow(cols, msg='Nenhum registro encontrado.') {
  return `<tr><td colspan="${cols}" class="px-4 py-10 text-center text-gray-400 text-sm">${msg}</td></tr>`;
}

function cardMetric(icon,label,id,sub='',color='indigo') {
  const clrs={indigo:'from-indigo-500 to-indigo-600',green:'from-green-500 to-green-600',yellow:'from-amber-500 to-amber-600',red:'from-red-500 to-red-600'};
  return `<div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
    <div class="flex items-center justify-between mb-3">
      <span class="text-2xl">${icon}</span>
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br ${clrs[color]||clrs.indigo} flex items-center justify-center opacity-80"></div>
    </div>
    <div class="text-2xl font-bold text-gray-800 mb-0.5" id="${id}">—</div>
    <div class="text-xs font-semibold text-gray-500 uppercase tracking-wide">${label}</div>
    ${sub?`<div class="text-xs text-gray-400 mt-1">${sub}</div>`:''}
  </div>`;
}

// ─── Modal helpers ────────────────────────────────
function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

function createModal(id, title, bodyHtml, footerHtml, size='md') {
  let el = document.getElementById(id);
  if (!el) {
    el = document.createElement('div');
    el.id = id;
    el.className = 'modal-overlay hidden';
    el.innerHTML = `<div class="modal-box ${size}">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-100">
        <h3 class="text-base font-bold text-gray-800" id="${id}-title">${title}</h3>
        <button onclick="closeModal('${id}')" class="text-gray-400 hover:text-gray-600 transition-colors text-xl leading-none p-1">✕</button>
      </div>
      <div class="px-6 py-5" id="${id}-body">${bodyHtml}</div>
      <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3" id="${id}-footer">${footerHtml}</div>
    </div>`;
    document.getElementById('modals').appendChild(el);
  }
  return el;
}

function formField(label, id, type='text', opts={}) {
  const {required=false, placeholder='', value='', cls='', rows=3, options=[]} = opts;
  const baseInput = 'w-full border border-gray-200 rounded-lg px-3.5 py-2.5 text-sm text-gray-800 bg-white';
  if (type==='select') {
    const optHtml = options.map(o=>Array.isArray(o)?`<option value="${o[0]}">${o[1]}</option>`:`<option value="${o}">${o}</option>`).join('');
    return `<div class="${cls}"><label class="block text-sm font-semibold text-gray-600 mb-1.5">${label}${required?' <span class="text-red-400">*</span>':''}</label>
      <select id="${id}" class="${baseInput}" ${required?'required':''}>${optHtml}</select></div>`;
  }
  if (type==='textarea') {
    return `<div class="${cls}"><label class="block text-sm font-semibold text-gray-600 mb-1.5">${label}</label>
      <textarea id="${id}" rows="${rows}" placeholder="${placeholder}" class="${baseInput}">${value}</textarea></div>`;
  }
  return `<div class="${cls}"><label class="block text-sm font-semibold text-gray-600 mb-1.5">${label}${required?' <span class="text-red-400">*</span>':''}</label>
    <input type="${type}" id="${id}" placeholder="${placeholder}" value="${value}" class="${baseInput}" ${required?'required':''}></div>`;
}

function btnPrimary(label, onclick, id='') {
  return `<button ${id?`id="${id}"`:''} onclick="${onclick}" class="bg-primary hover:bg-primary-dark text-white font-semibold px-5 py-2 rounded-lg text-sm transition-colors">${label}</button>`;
}
function btnGhost(label, onclick) {
  return `<button onclick="${onclick}" class="border border-gray-200 text-gray-600 hover:bg-gray-50 font-semibold px-5 py-2 rounded-lg text-sm transition-colors">${label}</button>`;
}

// ─── Init ─────────────────────────────────────────
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('login-btn');
  const errEl = document.getElementById('auth-error');
  errEl.classList.add('hidden');
  btn.textContent = 'Entrando...'; btn.disabled = true;
  try {
    const r = await login(document.getElementById('login-email').value, document.getElementById('login-password').value);
    if (r && r.token) {
      Auth.setToken(r.token);
      Auth.user = r.user;
      if (r.refresh_token) localStorage.setItem('visaoos_refresh', r.refresh_token);
      startApp();
    } else {
      errEl.textContent = r?.error || 'Credenciais inválidas.';
      errEl.classList.remove('hidden');
      btn.textContent = 'Entrar'; btn.disabled = false;
    }
  } catch(err) {
    errEl.textContent = 'Erro inesperado: ' + err.message;
    errEl.classList.remove('hidden');
    btn.textContent = 'Entrar'; btn.disabled = false;
  }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  api('POST','/auth/logout').finally(handleLogout);
});

function startApp() {
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app-screen').classList.remove('hidden');
  document.getElementById('user-name').textContent = App.user.name;
  document.getElementById('user-role').textContent = ({admin:'Administrador',atendimento:'Atendimento',producao:'Produção',financeiro:'Financeiro'})[App.user.role]||App.user.role;
  document.getElementById('user-avatar').textContent = App.user.name[0].toUpperCase();
  buildNav();
  const saved = localStorage.getItem('visaoos_page') || 'dashboard';
  navigate(saved);
}

window.addEventListener('DOMContentLoaded', async () => {
  const tok = localStorage.getItem('visaoos_token');
  if (!tok) return;
  try {
    const meCtrl = new AbortController();
    const meTimer = setTimeout(() => meCtrl.abort(), 10000);
    const r = await fetch('/api/auth/me', {
      headers:{'Authorization':`Bearer ${tok}`},
      signal: meCtrl.signal,
    });
    clearTimeout(meTimer);
    if (r.ok) {
      const ct = r.headers.get('content-type') || '';
      if (!ct.includes('json')) return; // servidor retornou HTML, ignora
      const data = await r.json();
      Auth.setToken(tok); Auth.user = data.user || data;
      startApp();
    }
  } catch(_) {
    // token inválido ou servidor offline — permanece na tela de login
  }
});
</script>

<script>
// ═══════════════════════════════════════════════════
// ORDENS DE SERVIÇO
// ═══════════════════════════════════════════════════
// FIX P8: osPage e osTotal eram globais soltos. osTotal nunca era lido
// (calculado localmente em fetchOS). Agora o estado de paginação vive
// em Filters.os, junto com os filtros que sempre mudavam juntos.
// FIX P3: estado de formulário de OS isolado — nunca vai para o objeto global App.
const OSForm = {
  items: [],    // antes: App.osItems (estado acidental no objeto global)
  reset() { this.items = []; },
};

function loadOS() {
  const el = document.getElementById('page-os');
  if (!el.dataset.init) {
    el.dataset.init = '1';
    el.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div><h2 class="text-xl font-bold text-gray-800">Ordens de Serviço</h2>
        <p id="os-count-label" class="text-sm text-gray-400 mt-0.5">—</p></div>

      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-4">
        <div class="flex flex-wrap items-center gap-3 p-4">
          <input type="text" id="os-search" placeholder="🔍 Buscar OS, cliente..." oninput="debounce('os',()=>{Filters.os.page=1;fetchOS()},350)"
            class="flex-1 min-w-[180px] border border-gray-200 rounded-lg px-3.5 py-2 text-sm">
          <select id="os-status-filter" onchange="Filters.os.page=1;fetchOS()" class="border border-gray-200 rounded-lg px-3.5 py-2 text-sm">
            <option value="">Todos os status</option>
            <option value="aguardando">Aguardando</option>
            <option value="producao">Em Produção</option>
            <option value="finalizado">Finalizado</option>
            <option value="entregue">Entregue</option>
          </select>
          <select id="os-pay-filter" onchange="Filters.os.page=1;fetchOS()" class="border border-gray-200 rounded-lg px-3.5 py-2 text-sm">
            <option value="">Pagamento</option>
            <option value="pendente">Pendente</option>
            <option value="parcial">Parcial</option>
            <option value="pago">Pago</option>
          </select>
        </div>
      </div>
      ${tableWrap('os-list',['Nº','Cliente','Descrição','Status','Pgto','Valor','Prazo','Ações'])}
      <div id="os-pagination" class="flex justify-end mt-4 gap-2"></div>`;
  }
  fetchOS();
}

async function fetchOS() {
  document.getElementById('os-list').innerHTML = loadingRow(8);
  // FIX P4: sincronizar DOM → Filters antes de montar URL, evita divergência
  Filters.os.search  = document.getElementById('os-search')?.value||'';
  Filters.os.status  = document.getElementById('os-status-filter')?.value||'';
  Filters.os.payment = document.getElementById('os-pay-filter')?.value||'';
  let url = `/os?limit=20&page=${Filters.os.page}`;
  if (Filters.os.search)  url += `&search=${encodeURIComponent(Filters.os.search)}`;
  if (Filters.os.status)  url += `&status=${Filters.os.status}`;
  if (Filters.os.payment) url += `&payment_status=${Filters.os.payment}`;
  const r = await api('GET', url);
  if (!r) return;
  const rows = r.data || r;
  const total = r.total || rows.length;
  document.getElementById('os-count-label').textContent = `${total} ordem(ns) encontrada(s)`;
  if (!rows.length) { document.getElementById('os-list').innerHTML = emptyRow(8,'Nenhuma OS encontrada.'); return; }
  document.getElementById('os-list').innerHTML = rows.map(o => `
    <tr class="hover:bg-gray-50 border-b border-gray-50">
      <td class="px-4 py-3 font-mono text-xs font-bold text-primary">${o.os_number}</td>
      <td class="px-4 py-3 font-medium text-gray-800">${o.client_name}</td>
      <td class="px-4 py-3 text-gray-600 max-w-[200px]"><div class="truncate">${o.description}</div></td>
      <td class="px-4 py-3">${osBadge(o.status)}</td>
      <td class="px-4 py-3">${payBadge(o.payment_status)}</td>
      <td class="px-4 py-3 font-semibold text-gray-800">${fmt.currency(o.total)}</td>
      <td class="px-4 py-3 text-xs text-gray-500">${fmt.date(o.due_date)}</td>
      <td class="px-4 py-3">
        <div class="flex items-center gap-1">
          <button onclick="viewOS(${o.id})" title="Ver" class="p-1.5 rounded hover:bg-gray-100 text-gray-500 hover:text-gray-800">👁️</button>
          <button onclick="window.open('/api/os/${o.id}/pdf?token='+Auth.getToken(),'_blank')" title="PDF" class="p-1.5 rounded hover:bg-gray-100 text-gray-500 hover:text-gray-800">🖨️</button>
          <button onclick="openStatusModal(${o.id},'${o.status}')" title="Status" class="p-1.5 rounded hover:bg-gray-100 text-gray-500 hover:text-gray-800">🔄</button>
        </div>
      </td>
    </tr>`).join('');
  // pagination
  if (r.pages > 1) {
    let pg = '';
    for (let i=1;i<=r.pages;i++) pg += `<button onclick="Filters.os.page=${i};fetchOS()" class="px-3 py-1 rounded text-sm font-medium ${i===Filters.os.page?'bg-primary text-white':'border border-gray-200 text-gray-600 hover:bg-gray-50'}">${i}</button>`;
    document.getElementById('os-pagination').innerHTML = pg;
  }
}

async function openNewOS() {
  // FIX P5: 4 chamadas paralelas com cache — tempo = max(latências), não soma
  const [clients, users, mats, svcs] = await Promise.all([
    Cache.get('clients',   () => api('GET', '/clients')),
    Cache.get('users',     () => api('GET', '/users')),
    Cache.get('materials', () => api('GET', '/materials')),
    Cache.get('services',  () => api('GET', '/services')),
  ]);

  const cliOpts = clients.filter(c=>c.active).map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
  const prodOpts = '<option value="">— Nenhum —</option>' + users.filter(u=>u.active&&(u.role==='producao'||u.role==='admin')).map(u=>`<option value="${u.id}">${u.name}</option>`).join('');
  const matOpts = mats.map(m=>`<option value="mat_${m.id}" data-type="material" data-id="${m.id}" data-unit="${m.unit}" data-pc="${m.price_client}" data-pr="${m.price_reseller}">${m.name} (${m.unit})</option>`).join('');
  const svcOpts = svcs.map(s=>`<option value="svc_${s.id}" data-type="service" data-id="${s.id}" data-unit="${s.unit}" data-pc="${s.price_client}" data-pr="${s.price_reseller}">${s.name} (${s.unit})</option>`).join('');

  createModal('modal-new-os','Nova Ordem de Serviço', `
    <div class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        ${formField('Cliente *','nos-client','select',{required:true,options:[['','Selecione...'],...clients.filter(c=>c.active).map(c=>[c.id,c.name])]})}
        ${formField('Responsável Produção','nos-prod','select',{options:[['','— Nenhum —'],...users.filter(u=>u.active&&(u.role==='producao'||u.role==='admin')).map(u=>[u.id,u.name])]})}
      </div>
      ${formField('Descrição / Serviço *','nos-desc','text',{required:true,placeholder:'Ex: Banner 2×1m em lona frontlit'})}
      <div class="grid grid-cols-3 gap-3">
        ${formField('Largura (m)','nos-w','number',{placeholder:'0.00'})}
        ${formField('Altura (m)','nos-h','number',{placeholder:'0.00'})}
        ${formField('Quantidade','nos-qty','number',{value:'1'})}
      </div>
      <div class="grid grid-cols-2 gap-3">
        ${formField('Desconto (%)','nos-disc','number',{placeholder:'0',value:'0'})}
        ${formField('Prazo de Entrega','nos-due','date')}
      </div>
      ${formField('Observações','nos-notes','textarea',{placeholder:'Informações adicionais, cores, detalhes técnicos...'})}
      ${formField('Notas Técnicas','nos-tech','textarea',{placeholder:'Informações para a equipe de produção...'})}
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="text-sm font-semibold text-gray-600">Itens (materiais/serviços)</label>
          <button type="button" onclick="addOSItem()" class="text-xs text-primary hover:underline font-medium">+ Adicionar item</button>
        </div>
        <div id="nos-items" class="space-y-2"></div>
        <div id="nos-items-select" class="hidden">
          <select id="nos-item-select" class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm mt-2">
            <option value="">— Selecione material ou serviço —</option>
            <optgroup label="Materiais">${matOpts}</optgroup>
            <optgroup label="Serviços">${svcOpts}</optgroup>
          </select>
        </div>
      </div>
      <div class="bg-gray-50 rounded-lg p-3 text-sm">
        <div class="flex justify-between"><span class="text-gray-500">Subtotal</span><span id="nos-subtotal" class="font-semibold">R$ 0,00</span></div>
        <div class="flex justify-between mt-1"><span class="text-gray-500">Desconto</span><span id="nos-discount-val" class="font-semibold text-red-500">R$ 0,00</span></div>
        <div class="flex justify-between mt-1 pt-2 border-t border-gray-200"><span class="font-bold text-gray-700">Total</span><span id="nos-total" class="font-bold text-primary text-base">R$ 0,00</span></div>
      </div>
    </div>`,
    btnGhost("Cancelar","closeModal('modal-new-os')") + btnPrimary('Salvar OS','saveNewOS()','btn-save-os'),
    'lg');
  openModal('modal-new-os');
  document.getElementById('nos-w').addEventListener('input', calcOSTotal);
  document.getElementById('nos-h').addEventListener('input', calcOSTotal);
  document.getElementById('nos-disc').addEventListener('input', calcOSTotal);
  OSForm.reset(); // FIX P3: estado isolado em OSForm, nunca no objeto global App
}

window.addOSItem = function() {
  document.getElementById('nos-items-select').classList.remove('hidden');
  document.getElementById('nos-item-select').onchange = function() {
    const opt = this.options[this.selectedIndex];
    if (!opt.value) return;
    const type = opt.dataset.type, id = opt.dataset.id;
    const name = opt.textContent.split(' (')[0];
    const unit = opt.dataset.unit, pc = opt.dataset.pc;
    OSForm.items = OSForm.items || [];
    OSForm.items.push({type, item_id:id, name, unit, quantity:1, unit_price:parseFloat(pc||0)});
    renderOSItems();
    this.value='';
    document.getElementById('nos-items-select').classList.add('hidden');
  };
};

function renderOSItems() {
  const c = document.getElementById('nos-items');
  if (!OSForm.items.length) { c.innerHTML=''; return; }
  c.innerHTML = OSForm.items.map((it,i)=>`
    <div class="flex items-center gap-2 bg-white border border-gray-200 rounded-lg px-3 py-2 text-sm">
      <span class="flex-1 font-medium text-gray-700">${it.name}</span>
      <input type="number" value="${it.quantity}" min="0.01" step="0.01" onchange="OSForm.items[${i}].quantity=parseFloat(this.value)||1;calcOSTotal()" class="w-20 border border-gray-200 rounded px-2 py-1 text-xs text-center">
      <span class="text-gray-400 text-xs">${it.unit}</span>
      <input type="number" value="${it.unit_price}" min="0" step="0.01" onchange="OSForm.items[${i}].unit_price=parseFloat(this.value)||0;calcOSTotal()" class="w-24 border border-gray-200 rounded px-2 py-1 text-xs text-right">
      <button onclick="OSForm.items.splice(${i},1);renderOSItems();calcOSTotal()" class="text-red-400 hover:text-red-600 ml-1">✕</button>
    </div>`).join('');
  calcOSTotal();
}

function calcOSTotal() {
  const w = parseFloat(document.getElementById('nos-w')?.value||0);
  const h = parseFloat(document.getElementById('nos-h')?.value||0);
  const area = w*h || 1;
  const disc = parseFloat(document.getElementById('nos-disc')?.value||0);
  const items = OSForm.items || [];
  const sub = items.reduce((s,it)=>s+(it.quantity * it.unit_price * (w&&h?area:1)),0);
  const discVal = sub * disc/100;
  const total = sub - discVal;
  document.getElementById('nos-subtotal').textContent = fmt.currency(sub);
  document.getElementById('nos-discount-val').textContent = fmt.currency(discVal);
  document.getElementById('nos-total').textContent = fmt.currency(total);
}

window.saveNewOS = async function() {
  const btn = document.getElementById('btn-save-os');
  btn.textContent='Salvando...'; btn.disabled=true;
  const w = parseFloat(document.getElementById('nos-w').value||0);
  const h = parseFloat(document.getElementById('nos-h').value||0);
  const area = w*h;
  const disc = parseFloat(document.getElementById('nos-disc').value||0);
  const items = OSForm.items||[];
  const sub = items.reduce((s,it)=>s+(it.quantity*it.unit_price*(w&&h?area:1)),0);
  const r = await api('POST','/os',{
    client_id: parseInt(document.getElementById('nos-client').value),
    description: document.getElementById('nos-desc').value,
    notes: document.getElementById('nos-notes').value,
    technical_notes: document.getElementById('nos-tech').value,
    production_id: document.getElementById('nos-prod').value||null,
    width_m:w||null, height_m:h||null, area_m2:area||null,
    quantity:parseFloat(document.getElementById('nos-qty').value||1),
    subtotal:sub, discount_pct:disc,
    due_date: document.getElementById('nos-due').value||null,
    items: items.map(it=>({...it,total_price:it.quantity*it.unit_price*(w&&h?area:1)}))
  });
  btn.textContent='Salvar OS'; btn.disabled=false;
  if (r && r.id) {
    toast('OS '+r.os_number+' criada com sucesso!');
    closeModal('modal-new-os');
    fetchOS();
  } else {
    toast(r?.error||'Erro ao salvar OS','error');
  }
};

window.viewOS = async function(id) {
  createModal('modal-view-os','Ordem de Serviço','<div class="text-center py-8 text-gray-400"><span class="spin inline-block">⟳</span> Carregando...</div>',
    `<button onclick="window.open('/api/os/${id}/pdf?token='+Auth.getToken(),'_blank')" class="border border-gray-200 text-gray-600 hover:bg-gray-50 font-semibold px-4 py-2 rounded-lg text-sm">🖨️ Gerar PDF</button>` +
    btnGhost("Fechar","closeModal('modal-view-os')"),'lg');
  openModal('modal-view-os');
  const os = await api('GET',`/os/${id}`);
  if (!os || os.error) { document.getElementById('modal-view-os-body').innerHTML = '<p class="text-red-500">Erro ao carregar OS.</p>'; return; }
  document.getElementById('modal-view-os-title').textContent = `OS ${os.os_number}`;
  document.getElementById('modal-view-os-body').innerHTML = `
    <div class="space-y-4">
      <div class="flex flex-wrap gap-2">
        ${osBadge(os.status)} ${payBadge(os.payment_status)}
        ${os.client_type==='revendedor'?badge('Revendedor','purple'):''}
      </div>
      <div class="grid grid-cols-2 gap-4 text-sm">
        <div><span class="text-gray-400">Cliente</span><div class="font-semibold">${os.client_name}</div></div>
        <div><span class="text-gray-400">Prazo</span><div class="font-semibold">${fmt.date(os.due_date)}</div></div>
        <div><span class="text-gray-400">Atendimento</span><div class="font-semibold">${os.attendant_name||'—'}</div></div>
        <div><span class="text-gray-400">Produção</span><div class="font-semibold">${os.production_name||'—'}</div></div>
      </div>
      <div class="text-sm"><span class="text-gray-400">Descrição</span><div class="font-semibold mt-0.5">${os.description}</div></div>
      ${os.notes?`<div class="text-sm"><span class="text-gray-400">Observações</span><div class="text-gray-700 mt-0.5">${os.notes}</div></div>`:''}
      ${os.technical_notes?`<div class="text-sm"><span class="text-gray-400">Notas Técnicas</span><div class="text-gray-700 mt-0.5">${os.technical_notes}</div></div>`:''}
      ${os.width_m?`<div class="text-sm"><span class="text-gray-400">Dimensões</span><div class="font-semibold">${os.width_m}m × ${os.height_m}m = ${fmt.area(os.area_m2)}</div></div>`:''}
      ${os.items?.length?`<div>
        <div class="text-sm text-gray-400 mb-2">Itens</div>
        <table class="w-full text-xs border rounded-lg overflow-hidden">
          <thead class="bg-gray-50"><tr><th class="px-3 py-2 text-left">Item</th><th class="px-3 py-2 text-left">Tipo</th><th class="px-3 py-2 text-right">Qtd</th><th class="px-3 py-2 text-right">Unit.</th><th class="px-3 py-2 text-right">Total</th></tr></thead>
          <tbody>${os.items.map(it=>`<tr class="border-t"><td class="px-3 py-2">${it.name}</td><td class="px-3 py-2">${it.type}</td><td class="px-3 py-2 text-right">${it.quantity} ${it.unit}</td><td class="px-3 py-2 text-right">${fmt.currency(it.unit_price)}</td><td class="px-3 py-2 text-right font-semibold">${fmt.currency(it.total_price)}</td></tr>`).join('')}</tbody>
        </table></div>`:''}
      <div class="bg-gray-50 rounded-lg p-3 text-sm space-y-1">
        <div class="flex justify-between"><span class="text-gray-500">Subtotal</span><span>${fmt.currency(os.subtotal)}</span></div>
        ${os.discount_pct>0?`<div class="flex justify-between"><span class="text-gray-500">Desconto (${os.discount_pct}%)</span><span class="text-red-500">-${fmt.currency(os.discount_val)}</span></div>`:''}
        <div class="flex justify-between pt-2 border-t border-gray-200 font-bold"><span>Total</span><span class="text-primary text-base">${fmt.currency(os.total)}</span></div>
      </div>
      ${os.payments?.length?`<div class="text-sm"><span class="text-gray-400">Pagamentos</span>
        <div class="mt-1 space-y-1">${os.payments.map(p=>`<div class="flex justify-between bg-green-50 rounded px-3 py-1.5"><span>${p.method} — ${fmt.datetime(p.paid_at)}</span><span class="font-bold text-green-700">${fmt.currency(p.amount)}</span></div>`).join('')}</div></div>`:''}
      ${['admin','financeiro'].includes(App.user.role)?`<div class="flex gap-2 pt-2">
        <button onclick="openPaymentModal(${id})" class="flex-1 border border-green-200 text-green-700 hover:bg-green-50 font-semibold px-3 py-2 rounded-lg text-sm transition-colors">💳 Registrar Pagamento</button>
        <button onclick="openStatusModal(${id},'${os.status}')" class="flex-1 border border-gray-200 text-gray-600 hover:bg-gray-50 font-semibold px-3 py-2 rounded-lg text-sm transition-colors">🔄 Mudar Status</button>
      </div>`:`<button onclick="openStatusModal(${id},'${os.status}')" class="w-full border border-gray-200 text-gray-600 hover:bg-gray-50 font-semibold px-3 py-2 rounded-lg text-sm transition-colors">🔄 Mudar Status</button>`}
    </div>`;
  document.getElementById('modal-view-os-footer').innerHTML =
    `<button onclick="window.open('/api/os/${id}/pdf?token='+Auth.getToken(),'_blank')" class="border border-gray-200 text-gray-600 hover:bg-gray-50 font-semibold px-4 py-2 rounded-lg text-sm">🖨️ PDF</button>` +
    btnGhost("Fechar","closeModal('modal-view-os')");
};

window.openStatusModal = function(id, current) {
  createModal('modal-status','Mudar Status da OS',`
    <div class="space-y-3">
      ${formField('Novo Status','st-status','select',{options:[['aguardando','Aguardando'],['producao','Em Produção'],['finalizado','Finalizado'],['entregue','Entregue']]})}
      ${formField('Observações','st-notes','textarea',{placeholder:'Motivo da mudança (opcional)...'})}
    </div>`,
    btnGhost("Cancelar","closeModal('modal-status')") + btnPrimary('Salvar','saveStatus('+id+')','btn-st'),'sm');
  document.getElementById('st-status').value = current;
  openModal('modal-status');
};

window.saveStatus = async function(id) {
  const btn = document.getElementById('btn-st');
  btn.textContent='...'; btn.disabled=true;
  const r = await api('PUT',`/os/${id}/status`,{status:document.getElementById('st-status').value, notes:document.getElementById('st-notes').value});
  btn.textContent='Salvar'; btn.disabled=false;
  if (r && !r.error) { toast('Status atualizado!'); closeModal('modal-status'); closeModal('modal-view-os'); fetchOS(); }
  else toast(r?.error||'Erro','error');
};

window.openPaymentModal = function(id) {
  createModal('modal-payment','Registrar Pagamento',`
    <div class="space-y-3">
      ${formField('Valor (R$) *','pay-amount','number',{required:true,placeholder:'0,00'})}
      ${formField('Forma de Pagamento *','pay-method','select',{required:true,options:[['','Selecione...'],['dinheiro','Dinheiro'],['pix','PIX'],['cartao_debito','Cartão Débito'],['cartao_credito','Cartão Crédito'],['transferencia','Transferência'],['boleto','Boleto']]})}
      ${formField('Referência / Comprovante','pay-ref','text',{placeholder:'Nº do comprovante...'})}
      ${formField('Observações','pay-notes','textarea',{})}
    </div>`,
    btnGhost("Cancelar","closeModal('modal-payment')") + btnPrimary('Registrar','savePayment('+id+')','btn-pay'),'sm');
  openModal('modal-payment');
};

window.savePayment = async function(id) {
  const btn = document.getElementById('btn-pay');
  btn.textContent='...'; btn.disabled=true;
  const r = await api('POST',`/os/${id}/payment`,{
    amount:parseFloat(document.getElementById('pay-amount').value),
    method:document.getElementById('pay-method').value,
    reference:document.getElementById('pay-ref').value,
    notes:document.getElementById('pay-notes').value
  });
  btn.textContent='Registrar'; btn.disabled=false;
  if (r && !r.error) { toast('Pagamento registrado!'); closeModal('modal-payment'); closeModal('modal-view-os'); fetchOS(); }
  else toast(r?.error||'Erro','error');
};
</script>

<script>
// ═══════════════════════════════════════════════════
// ORÇAMENTOS
// ═══════════════════════════════════════════════════
function loadQuotes() {
  const el = document.getElementById('page-quotes');
  if (!el.dataset.init) {
    el.dataset.init='1';
    el.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div><h2 class="text-xl font-bold text-gray-800">Orçamentos</h2></div>
        <button onclick="openNewQuote()" class="bg-primary hover:bg-primary-dark text-white font-semibold px-4 py-2 rounded-lg text-sm transition-colors">+ Novo Orçamento</button>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-4">
        <div class="flex flex-wrap items-center gap-3 p-4">
          <input type="text" id="qt-search" placeholder="🔍 Buscar orçamento..." oninput="debounce('qt',fetchQuotes,350)"
            class="flex-1 min-w-[180px] border border-gray-200 rounded-lg px-3.5 py-2 text-sm">
          <select id="qt-status" onchange="fetchQuotes()" class="border border-gray-200 rounded-lg px-3.5 py-2 text-sm">
            <option value="">Todos os status</option>
            <option value="pendente">Pendente</option>
            <option value="aprovado">Aprovado</option>
            <option value="recusado">Recusado</option>
            <option value="convertido">Convertido</option>
          </select>
        </div>
      </div>
      ${tableWrap('qt-list',['Nº','Cliente','Descrição','Status','Valor','Válido até','Ações'])}`;
  }
  fetchQuotes();
}

async function fetchQuotes() {
  document.getElementById('qt-list').innerHTML = loadingRow(7);
  const q = document.getElementById('qt-search')?.value||'';
  const s = document.getElementById('qt-status')?.value||'';
  let url = '/quotes';
  const p = []; if(q) p.push(`search=${encodeURIComponent(q)}`); if(s) p.push(`status=${s}`);
  if(p.length) url+='?'+p.join('&');
  const rows = await api('GET',url) || [];
  if (rows.error || !rows.length) { document.getElementById('qt-list').innerHTML=emptyRow(7,'Nenhum orçamento encontrado.'); return; }
  document.getElementById('qt-list').innerHTML = rows.map(q=>`
    <tr class="hover:bg-gray-50 border-b border-gray-50">
      <td class="px-4 py-3 font-mono text-xs font-bold text-primary">${q.quote_number}</td>
      <td class="px-4 py-3 font-medium">${q.client_name}</td>
      <td class="px-4 py-3 text-gray-600 max-w-[200px]"><div class="truncate">${q.description}</div></td>
      <td class="px-4 py-3">${quoteBadge(q.status)}</td>
      <td class="px-4 py-3 font-semibold">${fmt.currency(q.total)}</td>
      <td class="px-4 py-3 text-xs text-gray-500">${fmt.date(q.valid_until)}</td>
      <td class="px-4 py-3">
        <div class="flex items-center gap-1">
          <button onclick="window.open('/api/quotes/${q.id}/pdf?token='+Auth.getToken(),'_blank')" title="PDF" class="p-1.5 rounded hover:bg-gray-100 text-gray-500">🖨️</button>
          ${q.status!=='convertido'?`<button onclick="convertQuote(${q.id})" title="Converter em OS" class="p-1.5 rounded hover:bg-gray-100 text-green-600">🔄</button>`:''}
          <button onclick="changeQuoteStatus(${q.id},'${q.status}')" title="Status" class="p-1.5 rounded hover:bg-gray-100 text-gray-500">✏️</button>
        </div>
      </td>
    </tr>`).join('');
}

async function openNewQuote() {
  // FIX P5: usa cache de clientes — evita chamada duplicada com openNewOS
  const clients = await Cache.get('clients', () => api('GET', '/clients')) || [];
  createModal('modal-new-qt','Novo Orçamento',`
    <div class="space-y-4">
      ${formField('Cliente *','nqt-client','select',{required:true,options:[['','Selecione...'],...clients.filter(c=>c.active).map(c=>[c.id,c.name])]})}
      ${formField('Descrição / Serviço *','nqt-desc','text',{required:true,placeholder:'Ex: Fachada ACM com plotagem digital'})}
      <div class="grid grid-cols-3 gap-3">
        ${formField('Largura (m)','nqt-w','number',{placeholder:'0.00'})}
        ${formField('Altura (m)','nqt-h','number',{placeholder:'0.00'})}
        ${formField('Quantidade','nqt-qty','number',{value:'1'})}
      </div>
      <div class="grid grid-cols-2 gap-3">
        ${formField('Subtotal (R$) *','nqt-sub','number',{required:true,placeholder:'0,00'})}
        ${formField('Desconto (%)','nqt-disc','number',{placeholder:'0',value:'0'})}
      </div>
      ${formField('Válido até','nqt-valid','date')}
      ${formField('Observações','nqt-notes','textarea',{placeholder:'Condições comerciais, detalhes...'})}
      <div class="bg-gray-50 rounded-lg p-3 text-sm flex justify-between">
        <span class="font-bold text-gray-700">Total</span>
        <span id="nqt-total" class="font-bold text-primary text-base">R$ 0,00</span>
      </div>
    </div>`,
    btnGhost("Cancelar","closeModal('modal-new-qt')") + btnPrimary('Salvar Orçamento','saveNewQuote()','btn-qt'),'md');
  const calcQt = () => {
    const sub = parseFloat(document.getElementById('nqt-sub')?.value||0);
    const disc = parseFloat(document.getElementById('nqt-disc')?.value||0);
    document.getElementById('nqt-total').textContent = fmt.currency(sub - sub*disc/100);
  };
  document.getElementById('nqt-sub').addEventListener('input',calcQt);
  document.getElementById('nqt-disc').addEventListener('input',calcQt);
  openModal('modal-new-qt');
}

window.saveNewQuote = async function() {
  const btn = document.getElementById('btn-qt');
  btn.textContent='...'; btn.disabled=true;
  const sub = parseFloat(document.getElementById('nqt-sub').value||0);
  const disc = parseFloat(document.getElementById('nqt-disc').value||0);
  const r = await api('POST','/quotes',{
    client_id: parseInt(document.getElementById('nqt-client').value),
    description: document.getElementById('nqt-desc').value,
    notes: document.getElementById('nqt-notes').value,
    width_m: parseFloat(document.getElementById('nqt-w').value)||null,
    height_m: parseFloat(document.getElementById('nqt-h').value)||null,
    quantity: parseFloat(document.getElementById('nqt-qty').value||1),
    subtotal: sub, discount_pct: disc,
    valid_until: document.getElementById('nqt-valid').value||null
  });
  btn.textContent='Salvar Orçamento'; btn.disabled=false;
  if (r && r.id) { toast('Orçamento '+r.quote_number+' criado!'); closeModal('modal-new-qt'); fetchQuotes(); }
  else toast(r?.error||'Erro','error');
};

window.convertQuote = async function(id) {
  if (!confirm('Converter este orçamento em Ordem de Serviço?')) return;
  const due = prompt('Data de entrega (AAAA-MM-DD) ou deixe em branco:');
  const r = await api('POST',`/quotes/${id}/convert`, {due_date: due||null});
  if (r && r.os_id) { toast('OS '+r.os_number+' criada!'); fetchQuotes(); navigate('os'); }
  else toast(r?.error||'Erro ao converter','error');
};

window.changeQuoteStatus = function(id, current) {
  createModal('modal-qt-status','Mudar Status do Orçamento',`
    <div class="space-y-3">
      ${formField('Novo Status','qst-status','select',{options:[['pendente','Pendente'],['aprovado','Aprovado'],['recusado','Recusado']]})}
    </div>`,
    btnGhost("Cancelar","closeModal('modal-qt-status')") + btnPrimary('Salvar',`saveQtStatus(${id})`,'btn-qts'),'sm');
  document.getElementById('qst-status').value = current;
  openModal('modal-qt-status');
};

window.saveQtStatus = async function(id) {
  const r = await api('PUT',`/quotes/${id}/status`,{status:document.getElementById('qst-status').value});
  if (r && !r.error) { toast('Status atualizado!'); closeModal('modal-qt-status'); fetchQuotes(); }
  else toast(r?.error||'Erro','error');
};

// ═══════════════════════════════════════════════════
// RECIBOS
// ═══════════════════════════════════════════════════
function loadReceipts() {
  const el = document.getElementById('page-receipts');
  if (!el.dataset.init) {
    el.dataset.init='1';
    el.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <h2 class="text-xl font-bold text-gray-800">Recibos</h2>
        <button onclick="openNewReceipt()" class="bg-primary hover:bg-primary-dark text-white font-semibold px-4 py-2 rounded-lg text-sm transition-colors">+ Novo Recibo</button>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-4">
        <div class="flex items-center gap-3 p-4">
          <input type="text" id="rec-search" placeholder="🔍 Buscar recibo..." oninput="debounce('rec',fetchReceipts,350)"
            class="flex-1 border border-gray-200 rounded-lg px-3.5 py-2 text-sm">
        </div>
      </div>
      ${tableWrap('rec-list',['Nº Recibo','Cliente','OS','Descrição','Valor','Pagamento','Data','Ações'])}`;
  }
  fetchReceipts();
}

async function fetchReceipts() {
  document.getElementById('rec-list').innerHTML = loadingRow(8);
  const q = document.getElementById('rec-search')?.value||'';
  const rows = await api('GET','/receipts'+(q?`?search=${encodeURIComponent(q)}`:'')) || [];
  if (!rows.length || rows.error) { document.getElementById('rec-list').innerHTML=emptyRow(8,'Nenhum recibo encontrado.'); return; }
  document.getElementById('rec-list').innerHTML = rows.map(r=>`
    <tr class="hover:bg-gray-50 border-b border-gray-50">
      <td class="px-4 py-3 font-mono text-xs font-bold text-primary">${r.receipt_number}</td>
      <td class="px-4 py-3 font-medium">${r.client_name}</td>
      <td class="px-4 py-3 text-xs font-mono text-gray-500">${r.os_number||'—'}</td>
      <td class="px-4 py-3 text-gray-600 max-w-[180px]"><div class="truncate">${r.description}</div></td>
      <td class="px-4 py-3 font-bold text-green-700">${fmt.currency(r.amount)}</td>
      <td class="px-4 py-3 text-sm">${r.payment_method||'—'}</td>
      <td class="px-4 py-3 text-xs text-gray-500">${fmt.datetime(r.issued_at)}</td>
      <td class="px-4 py-3">
        <div class="flex items-center gap-1">
          <button onclick="window.open('/api/receipts/${r.id}/pdf?token='+Auth.getToken(),'_blank')" class="p-1.5 rounded hover:bg-gray-100 text-gray-500">🖨️</button>
          ${App.user.role==='admin'||App.user.role==='financeiro'?`<button onclick="deleteReceipt(${r.id})" class="p-1.5 rounded hover:bg-gray-100 text-red-400">🗑️</button>`:''}
        </div>
      </td>
    </tr>`).join('');
}

async function openNewReceipt() {
  // FIX P5: paralelo com cache — clientes já carregados não fazem nova chamada
  const [clients, osData] = await Promise.all([
    Cache.get('clients', () => api('GET', '/clients')),
    api('GET', '/os?limit=100'),
  ]);
  const osList = (osData?.data) || [];
  createModal('modal-new-rec','Novo Recibo',`
    <div class="space-y-4">
      ${formField('Cliente *','nrec-client','select',{required:true,options:[['','Selecione...'],...clients.filter(c=>c.active).map(c=>[c.id,c.name])]})}
      ${formField('Vincular OS (opcional)','nrec-os','select',{options:[['','— Nenhuma —'],...osList.map(o=>[o.id,`${o.os_number} — ${o.client_name}`])]})}
      ${formField('Descrição *','nrec-desc','text',{required:true,placeholder:'Referência do pagamento...'})}
      <div class="grid grid-cols-2 gap-3">
        ${formField('Valor (R$) *','nrec-amount','number',{required:true,placeholder:'0,00'})}
        ${formField('Forma de Pagamento','nrec-method','select',{options:[['','Selecione...'],['dinheiro','Dinheiro'],['pix','PIX'],['cartao_debito','Cartão Débito'],['cartao_credito','Cartão Crédito'],['transferencia','Transferência'],['boleto','Boleto']]})}
      </div>
      ${formField('Observações','nrec-notes','textarea',{})}
    </div>`,
    btnGhost("Cancelar","closeModal('modal-new-rec')") + btnPrimary('Emitir Recibo','saveNewReceipt()','btn-rec'),'md');
  openModal('modal-new-rec');
}

window.saveNewReceipt = async function() {
  const btn = document.getElementById('btn-rec');
  btn.textContent='...'; btn.disabled=true;
  const r = await api('POST','/receipts',{
    client_id: parseInt(document.getElementById('nrec-client').value),
    os_id: document.getElementById('nrec-os').value||null,
    description: document.getElementById('nrec-desc').value,
    amount: parseFloat(document.getElementById('nrec-amount').value),
    payment_method: document.getElementById('nrec-method').value,
    notes: document.getElementById('nrec-notes').value
  });
  btn.textContent='Emitir Recibo'; btn.disabled=false;
  if (r && r.id) { toast('Recibo '+r.receipt_number+' emitido!'); closeModal('modal-new-rec'); fetchReceipts(); }
  else toast(r?.error||'Erro','error');
};

window.deleteReceipt = async function(id) {
  if (!confirm('Excluir este recibo permanentemente?')) return;
  const r = await api('DELETE',`/receipts/${id}`);
  if (r && !r.error) { toast('Recibo excluído.'); fetchReceipts(); }
  else toast(r?.error||'Erro','error');
};
</script>

<script>
// ═══════════════════════════════════════════════════
// CLIENTES
// ═══════════════════════════════════════════════════
function loadClients() {
  const el = document.getElementById('page-clients');
  if (!el.dataset.init) {
    el.dataset.init='1';
    el.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <div><h2 class="text-xl font-bold text-gray-800">Clientes</h2>
        <p id="cli-count" class="text-sm text-gray-400 mt-0.5">—</p></div>
        <button onclick="openClientForm()" class="bg-primary hover:bg-primary-dark text-white font-semibold px-4 py-2 rounded-lg text-sm">+ Novo Cliente</button>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-4 p-4">
        <input type="text" id="cli-search" placeholder="🔍 Buscar cliente, CPF/CNPJ..." oninput="debounce('cli',fetchClients,350)"
          class="w-full border border-gray-200 rounded-lg px-3.5 py-2 text-sm">
      </div>
      ${tableWrap('cli-list',['Nome','Tipo','CPF/CNPJ','E-mail','WhatsApp','Cidade','Ações'])}`;
  }
  fetchClients();
}

async function fetchClients() {
  document.getElementById('cli-list').innerHTML = loadingRow(7);
  const q = document.getElementById('cli-search')?.value||'';
  const rows = await api('GET','/clients'+(q?`?search=${encodeURIComponent(q)}`:'')) || [];
  document.getElementById('cli-count').textContent = `${rows.length||0} cliente(s)`;
  if (!rows.length || rows.error) { document.getElementById('cli-list').innerHTML=emptyRow(7,'Nenhum cliente encontrado.'); return; }
  document.getElementById('cli-list').innerHTML = rows.filter(c=>c.type==='cliente').map(c=>`
    <tr class="hover:bg-gray-50 border-b border-gray-50">
      <td class="px-4 py-3 font-semibold text-gray-800">${c.name}</td>
      <td class="px-4 py-3">${badge('Cliente','blue')}</td>

        ${formField('Preço Revendedor (R$)','svc-pr','number',{placeholder:'0,00',value:s.price_reseller||''})}
      </div>
      ${formField('Prazo Estimado (dias)','svc-days','number',{placeholder:'1',value:s.estimated_days||'1'})}
      ${id?formField('Status','svc-active','select',{options:[['1','Ativo'],['0','Inativo']]}):''}
    </div>`,
    btnGhost("Cancelar","closeModal('modal-svc')") + btnPrimary(id?'Salvar':'Cadastrar',`saveService(${id||'null'})`,'btn-svc'),'md');
  // FIX P9: createModal é síncrono — elementos já existem no DOM aqui
  if(s.unit) { const e=document.getElementById('svc-unit'); if(e) e.value=s.unit; }
  if(id) { const e=document.getElementById('svc-active'); if(e) e.value=s.active?'1':'0'; }
  openModal('modal-svc');
}

window.saveService = async function(id) {
  const btn = document.getElementById('btn-svc');
  btn.textContent='...'; btn.disabled=true;
  const data = {
    name:document.getElementById('svc-name').value,
    unit:document.getElementById('svc-unit').value,
    price_client:parseFloat(document.getElementById('svc-pc').value||0),
    price_reseller:parseFloat(document.getElementById('svc-pr').value||0),
    estimated_days:parseInt(document.getElementById('svc-days').value||1),
    ...(id?{active:document.getElementById('svc-active').value==='1'}:{})
  };
  const r = id ? await api('PUT',`/services/${id}`,data) : await api('POST','/services',data);
  btn.textContent=id?'Salvar':'Cadastrar'; btn.disabled=false;
  if (r && !r.error) { Cache.invalidate('services'); toast(id?'Serviço atualizado!':'Serviço cadastrado!'); closeModal('modal-svc'); fetchServices(); }
  else toast(r?.error||'Erro','error');
};
</script>

<script>
// ═══════════════════════════════════════════════════
// FINANCEIRO
// ═══════════════════════════════════════════════════
function loadFinance() {
  const el = document.getElementById('page-finance');
  if (!el.dataset.init) {
    el.dataset.init='1';
    const today = new Date().toISOString().slice(0,10);
    const firstDay = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().slice(0,10);
    el.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <h2 class="text-xl font-bold text-gray-800">Financeiro</h2>
        <button onclick="exportFinance()" class="border border-gray-200 text-gray-600 hover:bg-gray-50 font-semibold px-4 py-2 rounded-lg text-sm">📊 Exportar Relatório</button>
      </div>
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 mb-5 p-4">
        <div class="flex flex-wrap items-end gap-3">
          <div><label class="block text-xs font-semibold text-gray-500 mb-1.5">De</label>
            <input type="date" id="fin-from" value="${firstDay}" class="border border-gray-200 rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold text-gray-500 mb-1.5">Até</label>
            <input type="date" id="fin-to" value="${today}" class="border border-gray-200 rounded-lg px-3 py-2 text-sm"></div>
          <div><label class="block text-xs font-semibold text-gray-500 mb-1.5">Tipo</label>
            <select id="fin-type" class="border border-gray-200 rounded-lg px-3 py-2 text-sm">
              <option value="">Todos</option>
              <option value="cliente">Cliente</option>
              <option value="revendedor">Revendedor</option>
            </select></div>
          <div><label class="block text-xs font-semibold text-gray-500 mb-1.5">Pagamento</label>
            <select id="fin-pay" class="border border-gray-200 rounded-lg px-3 py-2 text-sm">
              <option value="">Todos</option>
              <option value="pago">Pago</option>
              <option value="pendente">Pendente</option>
              <option value="parcial">Parcial</option>
            </select></div>
          <button onclick="fetchFinance()" class="bg-primary hover:bg-primary-dark text-white font-semibold px-4 py-2 rounded-lg text-sm">Filtrar</button>
        </div>
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        ${cardMetric('💰','Total Pago','fin-paid','','green')}
        ${cardMetric('⏳','A Receber','fin-pending','','yellow')}
        ${cardMetric('📈','Total Geral','fin-total','','indigo')}
        ${cardMetric('🗒️','Quantidade de OS','fin-count','','blue')}
      </div>
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
          <h3 class="text-sm font-bold text-gray-700 mb-4">📈 Faturamento por Mês (${new Date().getFullYear()})</h3>
          <canvas id="fin-chart" height="90"></canvas>
        </div>
        <div class="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
          <h3 class="text-sm font-bold text-gray-700 mb-4">👤 Relatório por Cliente</h3>
          <div id="fin-client-select-wrap" class="space-y-3">
            <p class="text-sm text-gray-400">Selecione um cliente para ver o histórico financeiro.</p>
            <select id="fin-client" class="w-full border border-gray-200 rounded-lg px-3.5 py-2 text-sm" onchange="loadClientReport()">
              <option value="">— Selecione um cliente —</option>
            </select>
            <div id="fin-client-data"></div>
          </div>
        </div>
      </div>
      ${tableWrap('fin-list',['Nº OS','Cliente','Tipo','Descrição','Valor','Pgto','Método','Data'])}`;
    // Load clients for selector
    api('GET','/clients').then(clients => {
      if (!clients || clients.error) return;
      const sel = document.getElementById('fin-client');
      clients.forEach(c => { const o=document.createElement('option'); o.value=c.id; o.textContent=c.name+(c.type==='revendedor'?' (Rev)':''); sel.appendChild(o); });
    });
    // Load chart
    api('GET','/finance/monthly?year='+new Date().getFullYear()).then(monthly => {
      if (!monthly || !Array.isArray(monthly)) return;
      const months=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      const data=Array(12).fill(0);
      monthly.forEach(m=>{ data[parseInt(m.month)-1]=parseFloat(m.revenue||0); });
      if (App.charts.fin) App.charts.fin.destroy();
      const ctx = document.getElementById('fin-chart');
      if (ctx) App.charts.fin = new Chart(ctx, {
        type:'bar',
        data:{labels:months,datasets:[{label:'Faturamento',data,backgroundColor:'rgba(34,197,94,.7)',borderRadius:5,borderSkipped:false}]},
        options:{responsive:true,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'R$'+v.toLocaleString('pt-BR')}}}}
      });
    });
  }
  fetchFinance();
}

async function fetchFinance() {
  document.getElementById('fin-list').innerHTML = loadingRow(8);
  const df = document.getElementById('fin-from')?.value||'';
  const dt = document.getElementById('fin-to')?.value||'';
  const ct = document.getElementById('fin-type')?.value||'';
  const ps = document.getElementById('fin-pay')?.value||'';
  let url = '/finance/report';
  const p = []; if(df)p.push(`date_from=${df}`); if(dt)p.push(`date_to=${dt}`); if(ct)p.push(`client_type=${ct}`); if(ps)p.push(`payment_status=${ps}`);
  if(p.length) url+='?'+p.join('&');
  const r = await api('GET',url);
  if (!r || r.error) return;
  const s = r.summary || {};
  document.getElementById('fin-paid').textContent    = fmt.currency(s.total_paid);
  document.getElementById('fin-pending').textContent = fmt.currency(s.total_pending);
  document.getElementById('fin-total').textContent   = fmt.currency(s.total);
  document.getElementById('fin-count').textContent   = s.count + ' OS';
  if (!r.rows?.length) { document.getElementById('fin-list').innerHTML=emptyRow(8,'Nenhuma OS no período.'); return; }
  document.getElementById('fin-list').innerHTML = r.rows.map(o=>`
    <tr class="hover:bg-gray-50 border-b border-gray-50">
      <td class="px-4 py-3 font-mono text-xs font-bold text-primary">${o.os_number}</td>
      <td class="px-4 py-3 font-medium">${o.client_name}</td>
      <td class="px-4 py-3">${o.client_type==='revendedor'?badge('Revendedor','purple'):badge('Cliente','blue')}</td>
      <td class="px-4 py-3 text-gray-600 max-w-[180px]"><div class="truncate">${o.description}</div></td>
      <td class="px-4 py-3 font-semibold">${fmt.currency(o.total)}</td>
      <td class="px-4 py-3">${payBadge(o.payment_status)}</td>
      <td class="px-4 py-3 text-sm text-gray-500">${o.payment_method||'—'}</td>
      <td class="px-4 py-3 text-xs text-gray-400">${fmt.datetime(o.created_at)}</td>
    </tr>`).join('');
}

async function loadClientReport() {
  const id = document.getElementById('fin-client').value;
  if (!id) return;
  const r = await api('GET',`/finance/client/${id}`);
  if (!r || r.error) return;
  const s = r.summary||{};
  document.getElementById('fin-client-data').innerHTML = `
    <div class="grid grid-cols-2 gap-2 text-sm">
      <div class="bg-green-50 rounded-lg p-2 text-center"><div class="text-xs text-green-600 font-semibold">Pago</div><div class="font-bold text-green-700">${fmt.currency(s.total_paid)}</div></div>
      <div class="bg-amber-50 rounded-lg p-2 text-center"><div class="text-xs text-amber-600 font-semibold">A Receber</div><div class="font-bold text-amber-700">${fmt.currency(s.total_pending)}</div></div>
    </div>
    <p class="text-xs text-gray-400 mt-2">${r.orders?.length||0} ordem(ns) no total</p>`;
}

function exportFinance() {
  const df = document.getElementById('fin-from')?.value||'';
  const dt = document.getElementById('fin-to')?.value||'';
  let url = `/api/finance/export?token=${Auth.getToken()}`;
  if(df) url+=`&date_from=${df}`; if(dt) url+=`&date_to=${dt}`;
  window.open(url, '_blank');
}
</script>

<script>
// ═══════════════════════════════════════════════════
// USUÁRIOS
// ═══════════════════════════════════════════════════
function loadUsers() {
  if (App.user.role !== 'admin') {
    document.getElementById('page-users').innerHTML = '<div class="text-center py-20 text-gray-400">Acesso restrito a administradores.</div>';
    return;
  }
  const el = document.getElementById('page-users');
  if (!el.dataset.init) {
    el.dataset.init='1';
    el.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
        <h2 class="text-xl font-bold text-gray-800">Usuários do Sistema</h2>
        <button onclick="openUserForm()" class="bg-primary hover:bg-primary-dark text-white font-semibold px-4 py-2 rounded-lg text-sm">+ Novo Usuário</button>
      </div>
      ${tableWrap('usr-list',['Nome','E-mail','Papel','Status','Último Login','Ações'])}`;
  }
  fetchUsers();
}

async function fetchUsers() {
  document.getElementById('usr-list').innerHTML = loadingRow(6);
  const rows = await api('GET','/users') || [];
  if (!rows.length || rows.error) { document.getElementById('usr-list').innerHTML=emptyRow(6,'Nenhum usuário encontrado.'); return; }
  const roleLabels = {admin:'Administrador',atendimento:'Atendimento',producao:'Produção',financeiro:'Financeiro'};
  const roleColors = {admin:'red',atendimento:'blue',producao:'yellow',financeiro:'green'};
  document.getElementById('usr-list').innerHTML = rows.map(u=>`
    <tr class="hover:bg-gray-50 border-b border-gray-50">
      <td class="px-4 py-3 font-semibold text-gray-800">${u.name}</td>
      <td class="px-4 py-3 text-sm text-gray-600">${u.email}</td>
      <td class="px-4 py-3">${badge(roleLabels[u.role]||u.role, roleColors[u.role]||'gray')}</td>
      <td class="px-4 py-3">${u.active?badge('Ativo','green'):badge('Inativo','gray')}</td>
      <td class="px-4 py-3 text-xs text-gray-400">${u.last_login?fmt.datetime(u.last_login):'Nunca'}</td>
      <td class="px-4 py-3">
        <div class="flex gap-1">
          <button onclick="openUserForm(${u.id})" class="p-1.5 rounded hover:bg-gray-100 text-gray-500">✏️</button>
          ${u.id!=App.user.id?`<button onclick="toggleUser(${u.id},${u.active})" class="p-1.5 rounded hover:bg-gray-100 ${u.active?'text-red-400':'text-green-500'}">${u.active?'🚫':'✅'}</button>`:''}
        </div>
      </td>
    </tr>`).join('');
}

async function openUserForm(id=null) {
  let u = {};
  if (id) { const r = await api('GET',`/users/${id}`); u = r||{}; }
  createModal('modal-usr',id?'Editar Usuário':'Novo Usuário',`
    <div class="space-y-4">
      ${formField('Nome Completo *','usr-name','text',{required:true,value:u.name||''})}
      ${formField('E-mail *','usr-email','email',{required:true,value:u.email||''})}
      ${formField(id?'Nova Senha (deixe em branco para não alterar)':'Senha *','usr-pass','password',{placeholder:'Mínimo 8 caracteres'})}
      ${formField('Papel / Nível de Acesso','usr-role','select',{options:[['admin','Administrador — Acesso total'],['atendimento','Atendimento — OS, Clientes, Orçamentos'],['producao','Produção — Visualizar e atualizar OS'],['financeiro','Financeiro — Relatórios e pagamentos']]})}
    </div>`,
    btnGhost("Cancelar","closeModal('modal-usr')") + btnPrimary(id?'Salvar Alterações':'Cadastrar Usuário',`saveUser(${id||'null'})`,'btn-usr'),'md');
  // FIX P9: createModal é síncrono — elementos já existem no DOM aqui
  if(u.role) { const e=document.getElementById('usr-role'); if(e) e.value=u.role; }
  openModal('modal-usr');
}

window.saveUser = async function(id) {
  const btn = document.getElementById('btn-usr');
  btn.textContent='...'; btn.disabled=true;
  const pass = document.getElementById('usr-pass').value;
  const data = {
    name:document.getElementById('usr-name').value,
    email:document.getElementById('usr-email').value,
    role:document.getElementById('usr-role').value,
    ...(pass?{password:pass}:{})
  };
  const r = id ? await api('PUT',`/users/${id}`,data) : await api('POST','/users',data);
  btn.textContent=id?'Salvar Alterações':'Cadastrar Usuário'; btn.disabled=false;
  if (r && !r.error) { toast(id?'Usuário atualizado!':'Usuário cadastrado!'); closeModal('modal-usr'); fetchUsers(); }
  else toast(r?.error||'Erro','error');
};

window.toggleUser = async function(id, active) {
  if (!confirm(active?'Desativar este usuário?':'Reativar este usuário?')) return;
  const r = active ? await api('DELETE',`/users/${id}`) : await api('PUT',`/users/${id}`,{active:1});
  if (!r?.error) { toast(active?'Usuário desativado.':'Usuário reativado.'); fetchUsers(); }
  else toast(r.error,'error');
};
</script>

<script>
// Fix: expose navigate/viewOS globally (they're already on window via function declarations, but ensure)
window.navigate = navigate;
window.viewOS = viewOS;
window.openModal = openModal;
window.closeModal = closeModal;
</script>
</body>
