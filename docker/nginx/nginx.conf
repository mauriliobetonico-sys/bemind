# ══════════════════════════════════════════════════════════════════════════
# VisãoOS — Nginx Reverse Proxy Config
# Substitua bemindmarketing.com.br pelo seu domínio real
# ══════════════════════════════════════════════════════════════════════════

# ── n8n ──────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name n8n.bemindmarketing.com.br;
    ssl_certificate     /etc/letsencrypt/live/n8n.bemindmarketing.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.bemindmarketing.com.br/privkey.pem;

    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        client_max_body_size 50M;
    }
}

# ── Metabase ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name metabase.bemindmarketing.com.br;
    ssl_certificate     /etc/letsencrypt/live/metabase.bemindmarketing.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/metabase.bemindmarketing.com.br/privkey.pem;

    location / {
        proxy_pass http://metabase:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ── Nextcloud ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name cloud2.bemindmarketing.com.br;
    ssl_certificate     /etc/letsencrypt/live/cloud2.bemindmarketing.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud2.bemindmarketing.com.br/privkey.pem;

    client_max_body_size 512M;

    location / {
        proxy_pass http://nextcloud:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
    }
}

# ── Mautic ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name mautic.bemindmarketing.com.br;
    ssl_certificate     /etc/letsencrypt/live/mautic.bemindmarketing.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mautic.bemindmarketing.com.br/privkey.pem;

    location / {
        proxy_pass http://mautic:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Jenkins ───────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name ci.bemindmarketing.com.br;
    ssl_certificate     /etc/letsencrypt/live/ci.bemindmarketing.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ci.bemindmarketing.com.br/privkey.pem;

    location / {
        proxy_pass http://jenkins:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name n8n.bemindmarketing.com.br metabase.bemindmarketing.com.br cloud2.bemindmarketing.com.br mautic.bemindmarketing.com.br ci.bemindmarketing.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
