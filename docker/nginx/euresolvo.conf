# ══════════════════════════════════════════════════════════════════════════
# EU RESOLVO — Nginx (para hospedagem própria com Apache/PHP OU Nginx+PHP-FPM)
# Use este arquivo quando montar Nginx como reverse-proxy para PHP-FPM,
# ou como referência para configurar seu VirtualHost do Apache/cPanel.
# ══════════════════════════════════════════════════════════════════════════

upstream euresolvo_ws { server 127.0.0.1:6001; }

server {
    listen 443 ssl http2;
    server_name euresolvo.com.br www.euresolvo.com.br;

    ssl_certificate     /etc/letsencrypt/live/euresolvo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/euresolvo.com.br/privkey.pem;

    root /var/www/euresolvo;
    index index.html index.php;

    client_max_body_size 25M;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # WebSocket para /ws
    location /ws {
        proxy_pass http://euresolvo_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # Assets estáticos com cache longo
    location ~* \.(?:css|js|png|jpg|jpeg|svg|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Uploads: bloqueia execução de PHP dentro de /uploads
    location ^~ /uploads/ {
        location ~ \.php$ { deny all; }
    }

    # Bloqueia arquivos sensíveis
    location ~* \.(env|sql|log|sh|md|lock)$ { deny all; }

    # SPAs por área
    location /portal/empresa    { try_files $uri /portals/empresa.html; }
    location /portal/instalador { try_files $uri /portals/instalador.html; }
    location /portal/admin      { try_files $uri /portals/admin.html; }
    location /portal/login      { try_files $uri /portals/login.html; }

    location = /termos-de-uso { try_files /legal/termos.html =404; }
    location = /privacidade   { try_files /legal/privacidade.html =404; }
    location = /lgpd          { try_files /legal/lgpd.html =404; }
    location = /sobre         { try_files /legal/sobre.html =404; }
    location = /carreiras     { try_files /legal/carreiras.html =404; }
    location = /imprensa      { try_files /legal/imprensa.html =404; }

    # API — tudo em /api/* vira PHP
    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    # Landing na raiz
    location = / { try_files /site/index.html =404; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location / { try_files $uri /site/index.html; }
}

server {
    listen 80;
    server_name euresolvo.com.br www.euresolvo.com.br;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
