version: '3.8'

# ══════════════════════════════════════════════════════════════════════════
# VisãoOS — Stack Completa de Ferramentas
# Serviços: n8n, Metabase, Nextcloud, Mautic, Jenkins
# ══════════════════════════════════════════════════════════════════════════
# Uso:
#   cp .env.example .env   # configure as variáveis
#   docker compose up -d   # sobe tudo
#
# Subdomínios necessários (configure no seu DNS):
#   n8n.bemindmarketing.com.br
#   metabase.bemindmarketing.com.br
#   cloud2.bemindmarketing.com.br
#   mautic.bemindmarketing.com.br
#   ci.bemindmarketing.com.br
# ══════════════════════════════════════════════════════════════════════════

networks:
  visaoos:
    driver: bridge

volumes:
  n8n_data:
  metabase_data:
  nextcloud_data:
  nextcloud_db_data:
  mautic_data:
  mautic_db_data:
  jenkins_data:
  nginx_certs:

services:

  # ── Nginx Reverse Proxy + SSL (Let's Encrypt) ────────────────────────
  nginx:
    image: jonasal/nginx-certbot:latest
    container_name: visaoos_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/user_conf.d/visaoos.conf:ro
      - nginx_certs:/etc/letsencrypt
    environment:
      - CERTBOT_EMAIL=${SSL_EMAIL}
    networks:
      - visaoos
    depends_on:
      - n8n
      - metabase
      - nextcloud
      - mautic

  # ── n8n — Automação de Workflows ─────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: visaoos_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-n8n.bemindmarketing.com.br}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://${N8N_HOST:-n8n.bemindmarketing.com.br}/
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      - DB_TYPE=sqlite
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - visaoos

  # ── Metabase — Dashboards e Relatórios ───────────────────────────────
  metabase:
    image: metabase/metabase:latest
    container_name: visaoos_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MB_DB_TYPE=h2
      - MB_DB_FILE=/metabase-data/metabase.db
      - MB_SITE_URL=https://${METABASE_HOST:-metabase.bemindmarketing.com.br}
      - JAVA_TIMEZONE=America/Sao_Paulo
    volumes:
      - metabase_data:/metabase-data
    networks:
      - visaoos

  # ── Nextcloud — Armazenamento de Arquivos ─────────────────────────────
  nextcloud_db:
    image: mariadb:10.11
    container_name: visaoos_nextcloud_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${NEXTCLOUD_DB_ROOT_PASS}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASS}
    volumes:
      - nextcloud_db_data:/var/lib/mysql
    networks:
      - visaoos
    command: --transaction-isolation=READ-COMMITTED --log-bin=binlog --binlog-format=ROW

  nextcloud:
    image: nextcloud:28-apache
    container_name: visaoos_nextcloud
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=nextcloud_db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${NEXTCLOUD_DB_PASS}
      - NEXTCLOUD_ADMIN_USER=${NEXTCLOUD_ADMIN_USER:-admin}
      - NEXTCLOUD_ADMIN_PASSWORD=${NEXTCLOUD_ADMIN_PASS}
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_HOST:-cloud2.bemindmarketing.com.br}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=${NEXTCLOUD_HOST:-cloud2.bemindmarketing.com.br}
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      - nextcloud_db
    networks:
      - visaoos

  # ── Mautic — Marketing e CRM ─────────────────────────────────────────
  mautic_db:
    image: mariadb:10.11
    container_name: visaoos_mautic_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MAUTIC_DB_ROOT_PASS}
      - MYSQL_DATABASE=mautic
      - MYSQL_USER=mautic
      - MYSQL_PASSWORD=${MAUTIC_DB_PASS}
    volumes:
      - mautic_db_data:/var/lib/mysql
    networks:
      - visaoos

  mautic:
    image: mautic/mautic:5-apache
    container_name: visaoos_mautic
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      - MAUTIC_DB_HOST=mautic_db
      - MAUTIC_DB_NAME=mautic
      - MAUTIC_DB_USER=mautic
      - MAUTIC_DB_PASSWORD=${MAUTIC_DB_PASS}
      - MAUTIC_TRUSTED_PROXIES=0.0.0.0/0
    volumes:
      - mautic_data:/var/www/html
    depends_on:
      - mautic_db
    networks:
      - visaoos

  # ── Jenkins — CI/CD ───────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: visaoos_jenkins
    restart: unless-stopped
    ports:
      - "8082:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - TZ=America/Sao_Paulo
    volumes:
      - jenkins_data:/var/jenkins_home
    networks:
      - visaoos
